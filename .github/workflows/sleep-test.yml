name: Sleep Test
on:
  push:
  workflow_dispatch:
jobs:
  long-sleep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Start Workflow Telemetry
        uses: ./
      - name: Sleep for 10 minutes
        run: sleep 600
      - name: Wrap up
        run: echo "Sleep complete"
